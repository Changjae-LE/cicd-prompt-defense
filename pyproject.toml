[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-cicd"
version = "0.1.0"
description = "Research prototype for context-aware indirect prompt injection defense in CI/CD agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
agentguard = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

