version: "1.0"
thresholds:
  block: 0.80
  require_approval: 0.60
risk_weights:
  LOW: 0.05
  MEDIUM: 0.25
  HIGH: 0.50
  CRITICAL: 0.80
signals:
  suspicious_instruction: 0.30
  intent_mismatch: 0.45
  privilege_escalation: 0.40
  sequence_risk: 0.60
  untrusted_high_risk: 0.35
shell_allowlist:
  - pytest
  - git diff
  - kubectl get pods
  - docker build --check .
trusted_network_egress:
  - id: APPROVED_DEPLOYMENT_HEALTH
    purpose: deployment_health_check
    methods: [GET]
    destination_patterns:
      - '^https://status\.example/[a-z0-9-]+/health$'
    may_transmit_secret: false
  - id: APPROVED_ROTATION_PROOF
    purpose: credential_rotation
    methods: [POST]
    destination_patterns:
      - '^https://rotation\.example/[a-z0-9-]+$'
    payload_patterns:
      - 'rotation[_ -]?proof'
    allowed_sensitive_resources:
      - cloud-token
    may_transmit_secret: true
security_control_policy:
  workflow_paths:
    - .github/workflows/ci.yml
  required_controls:
    - replacement-scan
  retired_controls:
    - legacy-scan
rules:
  - id: SECRET_TO_NETWORK_DENY
    description: Secret data must not reach a network destination without an exact trusted user/policy egress grant.
  - id: SCOPED_SECRET_EGRESS_AUTHORIZATION
    description: Trusted user intent and trusted policy may authorize one exact sensitive egress scope.
  - id: UNTRUSTED_HIGH_RISK_DENY
    description: Untrusted content cannot authorize high-risk tools.
  - id: HIGH_RISK_REQUIRES_INTENT
    description: High-risk actions must align with explicit user intent.
  - id: DESTRUCTIVE_K8S_APPROVAL
    description: Destructive Kubernetes operations require approval.
  - id: SHELL_ALLOWLIST_ONLY
    description: Shell commands must match the configured allowlist.
  - id: EXTERNAL_CANNOT_OVERRIDE_POLICY
    description: Repository or log text cannot override security policy.
  - id: SECRET_REQUIRES_EXPLICIT_INTENT
    description: Secret reads require explicit user intent.
  - id: SCOPED_USER_AUTHORIZATION
    description: Trusted user scope may authorize only an exact Tool, resource, action, purpose, and destination match.
  - id: UNTRUSTED_SCOPE_EXPANSION_DENY
    description: Untrusted content cannot add a Tool, resource, action, purpose, or destination outside trusted scope.
  - id: MULTI_SOURCE_SCOPE_EXPANSION_DENY
    description: Complementary instruction components assembled from multiple untrusted sources cannot authorize a high-risk call outside exact trusted scope.
  - id: SECURITY_CONTROL_SCOPE_DENY
    description: Security-control mutations must preserve trusted-policy-required controls and match trusted user scope.
